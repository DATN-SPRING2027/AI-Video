  <script>
    (function () {
      const CUES = [
        { id: "#cap-g1", start: 0.80, end: 3.12 },
        { id: "#cap-g2", start: 3.18, end: 5.08 },
        { id: "#cap-g3", start: 5.66, end: 8.64 },

        { id: "#cap-g6", start: 15.24, end: 19.26 }
      ];

      const tl = gsap.timeline({ paused: true });
      for (const cue of CUES) {
        tl.set(cue.id, { visibility: "visible", opacity: 0 }, cue.start);
        tl.fromTo(
          cue.id,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.14, ease: "power2.out" },
          cue.start
        );
        tl.to(
          cue.id,
          { opacity: 0, duration: 0.12, ease: "power2.in" },
          Math.max(cue.start + 0.16, cue.end - 0.12)
        );
        tl.set(cue.id, { opacity: 0, visibility: "hidden" }, cue.end);
      }

      window.__timelines = window.__timelines || {};
      window.__timelines["captions"] = tl;
      tl.seek(0);
    })();
