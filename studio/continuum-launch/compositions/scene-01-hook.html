      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0;

          let t = Math.imul(a ^ (a >>> 15), 1 | a);

      const GRAPH_EDGES = [
        [0, 11], [0, 15], [0, 19], [0, 12], [0, 17], [0, 13], [0, 14], [0, 3],

        [4, 13], [5, 23], [5, 17], [6, 8], [6, 14], [7, 3], [7, 22], [7, 8],
        [8, 1], [8, 2], [9, 17], [9, 7], [9, 1], [10, 3], [10, 22], [10, 15], [10, 5],
        [11, 10], [11, 24], [11, 15], [12, 9], [12, 17], [12, 23], [13, 3], [13, 4], [13, 6],
        [14, 8], [14, 21], [14, 9], [16, 21], [16, 20], [16, 3], [18, 24], [18, 6],
        [20, 16], [20, 14], [24, 20]
      ];

      const rng = mulberry32(20270401);
      const pts = GRAPH_NODES.map((n, idx) => {
        if (idx === 0) return { ...n, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 };
        const phi = Math.acos(1 - (2 * (idx + 0.5)) / GRAPH_NODES.length);
        const theta = Math.PI * (1 + Math.sqrt(5)) * idx + (rng() - 0.5) * 0.22;
        const rx = 560 + rng() * 210;
        const ry = 230 + rng() * 90;
        const rz = 320 + rng() * 140;
        return {
          ...n,
          x: rx * Math.sin(phi) * Math.cos(theta),
          y: ry * Math.cos(phi),
          z: rz * Math.sin(phi) * Math.sin(theta),
          dx: Math.sin(phi) * Math.cos(theta),
          dy: Math.cos(phi) * 0.48,
          dz: Math.sin(phi) * Math.sin(theta)
        };
      });

      const canvas = document.getElementById("s1-graph-canvas");
      const ctx = canvas.getContext("2d");

      function renderFractureGraph(t) {
        if (!ctx) return;
        ctx.clearRect(0, 0, 1920, 1080);
        if (t < 2.95 || t > 8.1) return;

        const localT = Math.max(0, t - 3.0);
        // Fracture starts at t = 4.0s (localT = 1.0s)
        const fracture = Math.max(0, Math.min(1, (localT - 1.0) / 1.4));
        const rotY = localT * 0.18;
        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const cx = 960;
        const cy = 590;
        const fov = 1050;

        const projected = pts.map((p, idx) => {
          const drift = idx === 0 ? 0 : fracture * 125;
          const px = p.x + (p.dx || 0) * drift;
          const py = p.y + (p.dy || 0) * drift;
          const pz = p.z + (p.dz || 0) * drift;
          const rx = px * cosY - pz * sinY;
          const rz = px * sinY + pz * cosY;
          const scale = fov / (fov + rz + 360);
          return {
            idx,
            label: p.label,
            hub: !!p.hub,
            sx: cx + rx * scale,
            sy: cy + py * scale,
            rz,
            scale
          };
        });

        // Draw edges
        for (let i = 0; i < GRAPH_EDGES.length; i++) {
          const [aIdx, bIdx] = GRAPH_EDGES[i];
          const a = projected[aIdx];
          const b = projected[bIdx];
          const isHubEdge = aIdx === 0 || bIdx === 0;

          if (isHubEdge && fracture > 0.02) {
            if (fracture < 0.88) {
              ctx.save();
              ctx.strokeStyle = `rgba(239, 68, 68, ${(1 - fracture) * 0.9})`;
              ctx.lineWidth = 2.6;
              ctx.setLineDash([12, 12]);
              ctx.beginPath();
              ctx.moveTo(a.sx, a.sy);
              ctx.lineTo(b.sx, b.sy);
              ctx.stroke();
              ctx.restore();
            }
          } else {
            const alpha = fracture > 0 ? 0.25 : 0.45;
            ctx.strokeStyle = `rgba(148, 163, 184, ${alpha})`;
            ctx.lineWidth = 1.9;
            ctx.beginPath();
            ctx.moveTo(a.sx, a.sy);
            ctx.lineTo(b.sx, b.sy);
            ctx.stroke();
          }
        }

        // Draw nodes sorted back-to-front
        const sorted = projected.slice().sort((u, v) => v.rz - u.rz);
        for (const n of sorted) {
          const r = (n.hub ? 26 : 12) * n.scale;
          ctx.beginPath();
          ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
          if (n.hub) {
            ctx.fillStyle = fracture > 0.35 ? "#1f2937" : fracture > 0.02 ? "#ef4444" : "#3b82f6";
            ctx.fill();
            ctx.lineWidth = 3.5;
            ctx.strokeStyle = fracture > 0.02 ? "#ef4444" : "#93c5fd";
            ctx.stroke();
          } else {
            ctx.fillStyle = fracture > 0.3 ? "#475569" : "#3b82f6";
            ctx.fill();
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = fracture > 0.3 ? "#64748b" : "#93c5fd";
            ctx.stroke();
          }
        }

        // Collision-free label pass (front-to-back priority, hub first)
        const labelCandidates = projected
          .filter((n) => n.hub || n.idx <= 12)
          .sort((a, b) => (a.hub === b.hub ? a.rz - b.rz : a.hub ? -1 : 1));
        const placedBoxes = [];

        for (const n of labelCandidates) {
          const r = (n.hub ? 26 : 12) * n.scale;
          ctx.font = n.hub ? '700 26px "Inter"' : '600 22px "Inter"';
          const tw = ctx.measureText(n.label).width + 20;
          const th = n.hub ? 34 : 30;
          const bx = n.sx - tw / 2;
          const by = n.sy - r - th - 8;
          if (by < 305 || by + th > 885 || bx < 90 || bx + tw > 1830) continue;
          const collides = placedBoxes.some(
            (b) => !(bx + tw + 10 < b.x || bx > b.x + b.w + 10 || by + th + 8 < b.y || by > b.y + b.h + 8)
          );
          if (collides) continue;
          placedBoxes.push({ x: bx, y: by, w: tw, h: th });

          ctx.fillStyle = "rgba(11, 15, 25, 0.82)";
          ctx.beginPath();
          ctx.roundRect(bx, by, tw, th, 8);
          ctx.fill();

          ctx.fillStyle = n.hub
            ? fracture > 0.3
              ? "#fca5a5"
              : "#f8fafc"
            : fracture > 0.3
              ? "#cbd5e1"
              : "#f8fafc";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(n.label, n.sx, by + th / 2 + 1);
        }
      }

      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        clock,
        { t: 0 },
        {
          t: 12,
          duration: 12,
          ease: "none",
          onUpdate: function () {
            renderFractureGraph(clock.t);
          }
        },
