<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Continuum AI — Đăng Nhập Doanh Nghiệp &amp; Google OAuth 2.0</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/lottie.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #080c16;
        font-family: "Inter", sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #main-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 22% 18%, #162244 0%, #0b1020 48%, #070a13 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24"
      data-width="1920"
      data-height="1080"
    >
      <div id="main-bg" data-layout-ignore></div>

      <div
        id="scene1"
        class="clip"
        data-composition-id="scene1"
        data-composition-src="compositions/scene-01-intro.html"
        data-track-kind="graphics"
        data-start="0"
        data-duration="3.2"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>

      <div
        id="scene2"
        class="clip"
        data-composition-id="scene2"
        data-composition-src="compositions/scene-02-email-flow.html"
        data-track-kind="graphics"
        data-start="3.2"
        data-duration="10.6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <div
        id="scene3"
        class="clip"
        data-composition-id="scene3"
        data-composition-src="compositions/scene-03-google-flow.html"
        data-track-kind="graphics"
        data-start="13.8"
        data-duration="6.6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>

      <div
        id="scene4"
        class="clip"
        data-composition-id="scene4"
        data-composition-src="compositions/scene-04-outro.html"
        data-track-kind="graphics"
        data-start="20.4"
        data-duration="3.6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>

      <div
        id="captions"
        class="clip"
        data-composition-id="captions"
        data-composition-src="compositions/captions-overlay.html"
        data-track-kind="captions"
        data-start="0"
        data-duration="24"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
        style="z-index: 10"
      ></div>

      <!-- Vietnamese AI Narration -->
      <audio
        id="vo-track"
        class="clip"
        src="assets/audio/voiceover.wav"
        data-start="0.8"
        data-duration="18.75"
        data-track-index="3"
        data-volume="1"
      ></audio>

      <!-- Royalty-Free SaaS Background Music -->
      <audio
        id="bgm-track"
        class="clip"
        src="assets/audio/bgm.mp3"
        data-start="0"
        data-duration="24"
        data-track-index="4"
        data-volume="0.16"
        data-fade-in="0.8"
        data-fade-out="2.2"
      ></audio>

      <!-- 4 Golden SaaS UI Sound Effects synced to camera moves, clicks, typing & success -->
      <audio id="sfx-whoosh-1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.15" data-duration="0.55" data-track-index="5" data-volume="0.32"></audio>
      <audio id="sfx-whoosh-2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.2" data-duration="0.55" data-track-index="5" data-volume="0.30"></audio>
      <audio id="sfx-click-email" class="clip" src="assets/sfx/click-soft.mp3" data-start="4.1" data-duration="0.36" data-track-index="6" data-volume="0.38"></audio>
      <audio id="sfx-typing-1" class="clip" src="assets/sfx/typing.mp3" data-start="4.35" data-duration="1.5" data-track-index="7" data-volume="0.28"></audio>
      <audio id="sfx-click-pass" class="clip" src="assets/sfx/click-soft.mp3" data-start="6.25" data-duration="0.36" data-track-index="6" data-volume="0.38"></audio>
      <audio id="sfx-typing-2" class="clip" src="assets/sfx/typing.mp3" data-start="6.5" data-duration="1.5" data-track-index="7" data-volume="0.28"></audio>
      <audio id="sfx-click-submit" class="clip" src="assets/sfx/send-click.wav" data-start="8.55" data-duration="0.36" data-track-index="6" data-volume="0.35"></audio>
      <audio id="sfx-click-org" class="clip" src="assets/sfx/click-soft.mp3" data-start="10.5" data-duration="0.36" data-track-index="6" data-volume="0.38"></audio>
      <audio id="sfx-confirm-org" class="clip" src="assets/sfx/confirm-success.wav" data-start="11.6" data-duration="0.34" data-track-index="8" data-volume="0.36"></audio>
      <audio id="sfx-whoosh-3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="13.8" data-duration="0.55" data-track-index="5" data-volume="0.32"></audio>
      <audio id="sfx-click-google" class="clip" src="assets/sfx/send-click.wav" data-start="15.35" data-duration="0.36" data-track-index="6" data-volume="0.38"></audio>
      <audio id="sfx-chime-google" class="clip" src="assets/sfx/chime.mp3" data-start="17.2" data-duration="2.4" data-track-index="8" data-volume="0.28"></audio>
      <audio id="sfx-whoosh-4" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="20.4" data-duration="0.55" data-track-index="5" data-volume="0.32"></audio>
      <audio id="sfx-sparkle-end" class="clip" src="assets/sfx/sparkle.mp3" data-start="20.9" data-duration="1.8" data-track-index="8" data-volume="0.28"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
