<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --bg-deep: #090d16;
        --bg-accent: #131c31;
        --ink: #f8fafc;
        --muted: #94a3b8;
        --cyan: #38bdf8;
        --violet: #a78bfa;
        --emerald: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(circle at 20% 20%, var(--bg-accent), var(--bg-deep) 70%);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--ink);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #badge {
        padding: 12px 28px;
        border-radius: 999px;
        border: 1px solid rgba(56, 189, 248, 0.4);
        background: rgba(56, 189, 248, 0.12);
        color: var(--cyan);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 32px;
      }
      #title {
        font-size: 96px;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-align: center;
        line-height: 1.08;
      }
      #subtitle {
        margin-top: 28px;
        font-size: 32px;
        color: var(--muted);
        text-align: center;
        max-width: 1500px;
      }
      #pills {
        margin-top: 56px;
        display: flex;
        gap: 20px;
      }
      .pill {
        padding: 16px 30px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 24px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="badge" class="clip" data-start="0" data-duration="4" data-track-index="0">
        Local AI Video Production Studio
      </div>
      <h1 id="title" class="clip" data-start="0.2" data-duration="3.8" data-track-index="1">
        CreateVideo Studio
      </h1>
      <p id="subtitle" class="clip" data-start="0.5" data-duration="3.5" data-track-index="2">
        HyperFrames • Knowledge Graph • GSAP • Three.js • ComfyUI Wan 2.2 • Piper TTS • ACE-Step • Whisper • FFmpeg
      </p>
      <div id="pills" class="clip" data-start="0.9" data-duration="3.1" data-track-index="3">
        <div class="pill">HTML / GSAP / 3D to MP4</div>
        <div class="pill">Wan 2.2 AI Video (6GB)</div>
        <div class="pill">Piper TTS + Music + SRT</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#badge", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo("#title", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power4.out" }, 0.2);
      tl.fromTo("#subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);
      tl.fromTo(".pill", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.12, ease: "power3.out" }, 0.9);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
