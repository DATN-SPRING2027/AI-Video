    (function () {
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const DOMAIN_COLORS = {
        arch: "#3b82f6",
        sec: "#10b981",
        ai: "#f59e0b",
        handover: "#06b6d4"
      };

      const NODES = [
        { label: "Continuum AI Core", dom: "arch", r: 22 },
        { label: "ADR-003 DB-Per-Service", dom: "arch", r: 15 },
        { label: "ADR-009 Task Lifecycle", dom: "arch", r: 14 },
        { label: "SAG Evidence Engine", dom: "ai", r: 19 },
        { label: "Session-Context Graph", dom: "ai", r: 15 },
        { label: "Immutable Audit", dom: "sec", r: 14 },
        { label: "Knowledge Gap #KG-14", dom: "handover", r: 15 },
        { label: "ACTIVE Verified Truth", dom: "sec", r: 17 },
        { label: "Successor Handover Pack", dom: "handover", r: 19 },
        { label: "Work Note #WN-209", dom: "handover", r: 16 },
        { label: "Pre-Retrieval ACL", dom: "sec", r: 18 },
        { label: "NestJS API Gateway", dom: "sec", r: 15 },
        { label: "svc_capture", dom: "handover", r: 13 },
        { label: "svc_chat", dom: "ai", r: 14 },
        { label: "svc_handover", dom: "handover", r: 15 },
        { label: "svc_iam", dom: "sec", r: 13 },
        { label: "svc_ingestion", dom: "ai", r: 13 },
        { label: "svc_lifecycle", dom: "sec", r: 15 },
        { label: "svc_notification", dom: "arch", r: 12 },
        { label: "svc_task", dom: "arch", r: 15 },
        { label: "BullMQ Workers", dom: "ai", r: 12 },
        { label: "Cloudflare R2", dom: "sec", r: 12 },
        { label: "LanceDB Vectors", dom: "ai", r: 15 },
        { label: "MongoDB 7.0 rs0", dom: "arch", r: 15 },
        { label: "Redis 7.2 Cluster", dom: "arch", r: 12 }
      ];

      const EDGES = [
        [1, 23], [1, 19], [1, 7], [2, 19], [2, 9],
        [3, 22], [3, 4], [3, 1], [3, 6], [4, 13], [4, 3],
        [0, 11], [0, 15], [0, 19], [0, 12], [0, 17], [0, 13], [0, 14], [0, 3],
        [5, 23], [5, 17], [6, 8], [6, 14],
        [7, 3], [7, 22], [7, 8], [8, 7], [8, 1], [8, 2],
        [9, 17], [9, 7], [9, 1], [10, 3], [10, 22], [10, 15], [10, 5],
        [11, 10], [11, 24], [11, 15], [12, 9], [12, 17], [12, 23],
        [13, 3], [13, 4], [13, 6], [14, 8], [14, 21], [14, 9],
        [16, 21], [16, 20], [16, 3], [18, 24], [18, 6],
        [19, 2], [19, 1], [19, 9], [20, 16], [20, 14], [22, 10], [23, 5]
      ];

      // Cluster offsets when community mode engages at t = 4.0s
      const CLUSTER_CENTERS = {
        arch: { x: -490, y: -65, z: -40 },
        sec: { x: 470, y: -55, z: 45 },
        ai: { x: -430, y: 155, z: 55 },
        handover: { x: 440, y: 155, z: -45 }
      };

      const rng = mulberry32(884210);
      const baseNodes = NODES.map((n, idx) => {
        if (idx === 0) return { ...n, x: 0, y: 20, z: 0, cx: -60, cy: 10, cz: 0 };
        const phi = Math.acos(1 - (2 * (idx + 0.5)) / NODES.length);
        const theta = Math.PI * (1 + Math.sqrt(5)) * idx;
        const rx = 560 + (rng() - 0.5) * 180;
        const ry = 235 + (rng() - 0.5) * 80;
        const rz = 320 + (rng() - 0.5) * 120;
        const bx = rx * Math.sin(phi) * Math.cos(theta);
        const by = ry * Math.cos(phi);
        const bz = rz * Math.sin(phi) * Math.sin(theta);
        const cc = CLUSTER_CENTERS[n.dom];
        return {
          ...n,
          x: bx,
          y: by,
          z: bz,
          cx: cc.x + bx * 0.36,
          cy: cc.y + by * 0.45,
          cz: cc.z + bz * 0.38
        };
      });

      const canvas = document.getElementById("s4-graph-canvas");
      const ctx = canvas.getContext("2d");

      function smoothstep(edge0, edge1, x) {
        const u = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
        return u * u * (3 - 2 * u);
      }

      function renderOrbitGraph(t) {
        if (!ctx) return;
        ctx.clearRect(0, 0, 1920, 1080);
        if (t > 8.85) return;

        // Community color + cluster morph activates smoothly at t = 3.8s..5.0s (F1470)
        const commMix = smoothstep(3.6, 5.0, t);
        const rotY = Math.sin(t * 0.28) * 0.38;
        const rotX = Math.sin(t * 0.36) * 0.1;
        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const cosX = Math.cos(rotX);
        const sinX = Math.sin(rotX);

        const cx = 960;
        const cy = 595;
        const fov = 1080;

        const proj = baseNodes.map((n, idx) => {
          const px = n.x + (n.cx - n.x) * commMix;
          const py = n.y + (n.cy - n.y) * commMix;
          const pz = n.z + (n.cz - n.z) * commMix;

          const rx = px * cosY - pz * sinY;
          const rz1 = px * sinY + pz * cosY;
          const ry = py * cosX - rz1 * sinX;
          const rz = py * sinX + rz1 * cosX;
          const scale = fov / (fov + rz + 360);
          return {
            idx,
            label: n.label,
            dom: n.dom,
            r: n.r,
            sx: cx + rx * scale,
            sy: cy + ry * scale,
            rz,
            scale
          };
        });

        // Draw verified edges + directional light particles
        for (let i = 0; i < EDGES.length; i++) {
          const [uIdx, vIdx] = EDGES[i];
          const a = proj[uIdx];
          const b = proj[vIdx];
          const domColor = DOMAIN_COLORS[a.dom] || "#3b82f6";

          ctx.strokeStyle = commMix > 0.2 ? "rgba(148, 163, 184, 0.34)" : "rgba(96, 165, 250, 0.34)";
          ctx.lineWidth = 1.9;
          ctx.beginPath();
          ctx.moveTo(a.sx, a.sy);
          ctx.lineTo(b.sx, b.sy);
          ctx.stroke();

          // Deterministic directional particle on key edges
          if (i % 3 === 0) {
            const prog = (t * 0.65 + i * 0.17) % 1;
            const px = a.sx + (b.sx - a.sx) * prog;
            const py = a.sy + (b.sy - a.sy) * prog;
            ctx.beginPath();
            ctx.arc(px, py, 4.2, 0, Math.PI * 2);
            ctx.fillStyle = commMix > 0.3 ? domColor : "#60a5fa";
            ctx.fill();
          }
        }

        // Draw nodes back-to-front
        const sorted = proj.slice().sort((a, b) => b.rz - a.rz);
        for (const n of sorted) {
          const radius = (n.r + 2) * n.scale;
          const col = commMix > 0.15 ? DOMAIN_COLORS[n.dom] : "#3b82f6";
          ctx.beginPath();
          ctx.arc(n.sx, n.sy, radius, 0, Math.PI * 2);
          ctx.fillStyle = col;
          ctx.fill();
          ctx.lineWidth = n.idx === 0 || n.idx === 8 ? 3.2 : 1.8;
          ctx.strokeStyle = "#f8fafc";
          ctx.stroke();
        }

        // Collision-free label pass with dark pill backing
        const priorityOrder = [0, 8, 3, 10, 1, 7, 9, 6, 4, 23, 22, 11, 14, 17, 19];
        const placedBoxes = [
          // Reserve HUD & Legend boxes so graph labels never collide with cards
          { x: 80, y: 130, w: 740, h: 165 },
          { x: 1370, y: 130, w: 470, h: 270 }
        ];

        for (const idx of priorityOrder) {
          const n = proj[idx];
          if (!n) continue;
          const radius = (n.r + 2) * n.scale;
          const isHero = idx === 0 || idx === 8 || idx === 3 || idx === 10;
          ctx.font = isHero ? '700 24px "Inter"' : '600 21px "Inter"';
          const tw = ctx.measureText(n.label).width + 20;
          const th = isHero ? 32 : 28;
          const bx = n.sx - tw / 2;
          const by = n.sy - radius - th - 8;
          if (by < 145 || by + th > 885 || bx < 88 || bx + tw > 1832) continue;
          const collides = placedBoxes.some(
            (b) => !(bx + tw + 12 < b.x || bx > b.x + b.w + 12 || by + th + 8 < b.y || by > b.y + b.h + 8)
          );
          if (collides) continue;
          placedBoxes.push({ x: bx, y: by, w: tw, h: th });

          ctx.fillStyle = "rgba(11, 15, 25, 0.84)";
          ctx.beginPath();
          ctx.roundRect(bx, by, tw, th, 8);
          ctx.fill();

          ctx.fillStyle = "#f8fafc";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(n.label, n.sx, by + th / 2 + 1);
        }
      }

      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        clock,
        { t: 0 },
        {
          t: 17,
          duration: 17,
          ease: "none",
          onUpdate: function () {
            renderOrbitGraph(clock.t);
          }
        },
        0
      );

      // Shot 4.1 (0.0s - 8.5s): 3D Graph + Community Legend at t = 4.0s (F1470)
      tl.fromTo(
        "#s4-hud",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#s4-legend",
        { opacity: 0, x: 32 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        3.8
      );
      tl.to(
        "#s4-shot1",
        { opacity: 0, duration: 0.35, ease: "power2.inOut" },
        8.25
      );

      // Shot 4.2 (8.5s - 17.0s): Successor Handover Roadmap (F1605)
      tl.fromTo(
        "#s4-shot2",
        { opacity: 0 },
        { opacity: 1, duration: 0.2, ease: "none" },
        8.5
      );
      tl.fromTo(
        "#s4-roadmap-card",
        { opacity: 0, scale: 0.95, y: 24 },
        { opacity: 1, scale: 1, y: 0, duration: 0.48, ease: "power3.out" },
        8.5
      );
      tl.fromTo(
        "#s4-day1",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        8.85
      );
      tl.fromTo(
        "#s4-day3",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        9.1
      );
      tl.fromTo(
        "#s4-day7",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        9.35
      );
      tl.fromTo(
        "#s4-audio-bar",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        9.7
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["scene4"] = tl;
      tl.seek(0);
      renderOrbitGraph(0);
    })();
